<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏎️ Carros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <h1>🏎️ Explorador de Carros</h1>
    <p class="subtitle">Consumindo nossa própria API em Node.js</p>

    <div class="controls">
      <button id="randomBtn">🎲 Carro Aleatório</button>
    </div>

    <div class="search">
      <input type="text" id="breedInput" placeholder="Digite um carro (ex: civic, bmw, porsche)">
      <button id="searchBtn">🔍 Buscar Carro</button>
    </div>

    <p id="message"></p>

    <div class="car-area">
      <img id="carImage" alt="Carro" hidden>
      <div id="breedName"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
